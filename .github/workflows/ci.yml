name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app.py helper.py

      - name: Run tests
        run: pytest tests/test_app.py

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/docker-prac:latest \
           -t ${{ secrets.DOCKERHUB_USERNAME }}/docker-prac:${{ github.sha }} .
 

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/docker-prac:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/docker-prac:${{ github.sha }}

      - name: Trigger Render deployment
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Verify deployment
        run: |
          sleep 30
          curl --fail https://docker-prac-w9xm.onrender.com/
